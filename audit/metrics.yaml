      "findings": [{"type": "definition-variant", "evidence": "The generic name NMSE does not identify the implemented air-quality product-of-means normalization among several established normalizations.", "impact": "Users can compare incompatible quantities under the same abbreviation.", "recommended_future_action": "Document the exact denominator and application domain."}, {"type": "validation-gap", "evidence": "The implementation accepts opposite-sign means and returns a negative normalized squared error, while zero means silently return NaN.", "impact": "Without a positive-mean domain, lower-is-better and nonnegative-error interpretations break down.", "recommended_future_action": "Document the unrestricted behavior now; consider explicit domain validation only in a separately reviewed behavior change."}]
